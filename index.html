<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">爪哇魯多模型店 - 預購商品目錄</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.5rem;
    }
    @media (min-width: 1024px) {
      .catalog-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.75rem;
      }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">
  <div>
    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-3 py-2 shadow-md">
      <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
        <div class="flex items-center space-x-2">
          <span class="text-xl">🤖</span>
          <h1 id="headerTitle" class="text-base sm:text-lg font-bold tracking-wider text-amber-400">爪哇魯多模型店 ｜ 預購目錄</h1>
        </div>
        
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <div class="bg-slate-800 p-0.5 rounded-lg border border-slate-700 flex text-xs font-semibold">
            <button id="btnCardMode" onclick="switchViewMode('card')" class="px-2.5 py-1 rounded-md bg-amber-500 text-slate-950 transition-all">🔲 卡片 (2*N)</button>
            <button id="btnListMode" onclick="switchViewMode('list')" class="px-2.5 py-1 rounded-md text-slate-300 hover:text-white transition-all">📋 清單</button>
          </div>
          <input id="searchInput" type="text" placeholder="搜尋條碼、品名關鍵字..." 
                 class="flex-1 sm:w-56 px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:ring-1 focus:ring-amber-400 text-xs">
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-2 py-3">
      <div id="productGrid" class="catalog-grid"></div>
      <div id="productList" class="hidden flex flex-col gap-2.5 max-w-5xl mx-auto"></div>
    </main>
  </div>

  <footer class="bg-slate-900/90 border-t border-slate-800 py-3 px-4 mt-6">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-xs">
      <div id="pageInfo" class="text-slate-400">顯示第 1 / 1 頁 (共 0 項)</div>
      <div class="flex items-center gap-1.5" id="paginationControls"></div>
    </div>
  </footer>

  <div id="imageModal" class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-sm flex items-center justify-center p-3 cursor-zoom-out" onclick="closeModal()">
    <div class="relative max-w-3xl max-h-[90vh] flex flex-col items-center" onclick="event.stopPropagation()">
      <img id="modalImg" src="" class="max-w-full max-h-[80vh] rounded-lg shadow-2xl object-contain border border-slate-700">
      <p id="modalCaption" class="mt-2 text-xs sm:text-sm text-slate-200 font-medium text-center"></p>
      <button onclick="closeModal()" class="absolute -top-3 -right-3 w-8 h-8 bg-slate-800 hover:bg-slate-700 text-white rounded-full flex items-center justify-center font-bold text-sm border border-slate-600 shadow-md">✕</button>
    </div>
  </div>

  <script>
    let allProducts = [];
    let filteredProducts = [];
    let currentPage = 1;
    let currentViewMode = 'card';
    const PAGE_SIZE = 12;

    async function init() {
      try {
        const res = await fetch('data.json?t=' + Date.now());
        allProducts = await res.json();
        filteredProducts = allProducts;
        
        updateDynamicTitles();
        renderPage();
      } catch (err) {
        document.getElementById('productGrid').innerHTML = '<p class="text-rose-400 p-4">無法載入 data.json</p>';
      }
    }

    function updateDynamicTitles() {
      if (allProducts.length === 0) return;
      let brand = allProducts[0].brand || "預購商品";
      let closeDate = allProducts[0].close_date || "依公告";
      if (brand.includes("(")) {
        brand = brand.split("(")[0].trim();
      }
      const titleStr = `${brand}預購目錄 ｜ ${closeDate} 截止`;
      document.getElementById('pageTitle').innerText = titleStr + " - 爪哇魯多模型店";
      document.getElementById('headerTitle').innerText = `爪哇魯多模型店 ｜ ${titleStr}`;
    }

    function switchViewMode(mode) {
      currentViewMode = mode;
      const btnCard = document.getElementById('btnCardMode');
      const btnList = document.getElementById('btnListMode');
      const cardView = document.getElementById('productGrid');
      const listView = document.getElementById('productList');

      if (mode === 'card') {
        btnCard.className = "px-2.5 py-1 rounded-md bg-amber-500 text-slate-950 transition-all";
        btnList.className = "px-2.5 py-1 rounded-md text-slate-300 hover:text-white transition-all";
        cardView.classList.remove('hidden');
        listView.classList.add('hidden');
      } else {
        btnList.className = "px-2.5 py-1 rounded-md bg-amber-500 text-slate-950 transition-all";
        btnCard.className = "px-2.5 py-1 rounded-md text-slate-300 hover:text-white transition-all";
        listView.classList.remove('hidden');
        cardView.classList.add('hidden');
      }
      renderPage();
    }

    function openModal(src, title) {
      document.getElementById('modalImg').src = src + '?t=' + Date.now();
      document.getElementById('modalCaption').innerText = title;
      document.getElementById('imageModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('imageModal').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    function getImageUrl(item) {
      const barcode = item.barcode || 'NO_BARCODE';
      // 加上時間戳記強制破除瀏覽器與 CDN 快取，確保永遠抓取最新圖檔
      return `./images/${barcode}.webp?t=v2`;
    }

    function handleImageError(img, barcode) {
      if (!img.dataset.triedJpg) {
        img.dataset.triedJpg = "true";
        img.src = `./images/${barcode}.jpg?t=v2`;
      } else if (!img.dataset.triedJpeg) {
        img.dataset.triedJpeg = "true";
        img.src = `./images/${barcode}.jpeg?t=v2`;
      } else {
        img.onerror = null;
        img.src = `https://placehold.co/300x300/1e293b/94a3b8?text=${barcode}`;
      }
    }

    function createCard(item) {
      const finalImg = getImageUrl(item);
      return `
        <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden flex flex-col justify-between shadow hover:border-amber-400/40 transition-all text-xs">
          <div>
            <div class="relative w-full aspect-square bg-slate-800 overflow-hidden cursor-zoom-in" 
                 onclick="openModal('${finalImg}', '${item.name.replace(/'/g, "\\'")}')">
              <img src="${finalImg}" loading="lazy" decoding="async" alt="${item.name}" 
                   class="w-full h-full object-cover transition-transform duration-200 hover:scale-105"
                   onerror="handleImageError(this, '${item.barcode}')"/>
              <span class="absolute top-1.5 left-1.5 px-1.5 py-0.5 text-[10px] font-semibold bg-slate-950/80 text-amber-300 rounded backdrop-blur-sm">
                ${item.brand}
              </span>
              <span class="absolute bottom-1.5 right-1.5 px-1 py-0.5 text-[9px] bg-slate-900/70 text-slate-300 rounded">
                🔍 放大
              </span>
            </div>
            
            <div class="p-2 space-y-1">
              <div class="flex items-center justify-between text-[10px]">
                <span class="text-slate-400 bg-slate-800 px-1 py-0.2 rounded">#${item.id}</span>
                <span class="font-mono text-amber-400/80 truncate ml-1">${item.barcode}</span>
              </div>
              <h2 class="font-medium text-slate-100 line-clamp-2 leading-tight h-8" title="${item.name}">${item.name}</h2>
              <div class="text-[10px] text-slate-400 flex justify-between pt-0.5">
                <span>上市:${item.release_date}</span>
                <span class="text-rose-400 font-semibold">結單:${item.close_date}</span>
              </div>
            </div>
          </div>

          <div class="p-2 pt-0 border-t border-slate-800/80 mt-1 space-y-1.5">
            <div class="flex items-baseline justify-between pt-1">
              <span class="text-[10px] text-slate-400">特惠價</span>
              <span class="text-sm font-bold text-amber-400">NT$ ${item.preorder_price}</span>
            </div>
            <div class="grid grid-cols-2 gap-1 pt-0.5">
              <button onclick="copyOrder('${item.barcode}', '${item.name.replace(/'/g, "\\'")}', ${item.preorder_price})" 
                      class="py-1 px-1 text-[10px] sm:text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 rounded transition-colors flex items-center justify-center truncate">
                <span>📋 複製商品資訊</span>
              </button>
              <a href="https://m.me/JavaRudo" target="_blank" rel="noopener noreferrer"
                 class="py-1 px-1 text-[10px] sm:text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white rounded transition-colors flex items-center justify-center truncate">
                <span>💬 FB私訊訂購</span>
              </a>
            </div>
          </div>
        </div>
      `;
    }

    function createListItem(item) {
      const finalImg = getImageUrl(item);
      return `
        <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden shadow flex hover:border-amber-400/40 transition-all text-xs">
          <div class="w-24 sm:w-28 aspect-square bg-slate-800 relative flex-shrink-0 cursor-zoom-in"
               onclick="openModal('${finalImg}', '${item.name.replace(/'/g, "\\'")}')">
            <img src="${finalImg}" loading="lazy" decoding="async" alt="${item.name}" 
                 class="w-full h-full object-cover" onerror="handleImageError(this, '${item.barcode}')"/>
          </div>
          <div class="flex-1 p-3 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center text-[11px] text-slate-400">
                <span class="font-medium text-slate-300">編號: #${item.id} ｜ ${item.brand}</span>
                <span class="font-mono text-amber-400/90 text-xs">${item.barcode}</span>
              </div>
              <h3 class="font-medium text-slate-100 text-sm mt-1 leading-snug line-clamp-2">${item.name}</h3>
              <p class="text-[11px] text-slate-400 mt-1">預定上市: <span class="font-mono text-slate-300">${item.release_date}</span> ｜ <span class="text-rose-400 font-medium">結單: ${item.close_date}</span></p>
            </div>
            
            <div class="flex flex-col sm:flex-row sm:items-center justify-between pt-2.5 border-t border-slate-800/80 gap-2 mt-2">
              <div class="flex items-baseline gap-1.5">
                <span class="text-[11px] text-slate-400">預購價</span>
                <span class="text-base font-black text-amber-400 font-mono">NT$ ${item.preorder_price}</span>
              </div>
              <div class="flex gap-2">
                <button onclick="copyOrder('${item.barcode}', '${item.name.replace(/'/g, "\\'")}', ${item.preorder_price})" 
                        class="px-3.5 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded shadow-sm text-xs transition-colors flex items-center justify-center min-w-[110px]">
                  📋 複製商品資訊
                </button>
                <a href="https://m.me/JavaRudo" target="_blank" rel="noopener noreferrer"
                   class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded shadow-sm text-xs transition-colors flex items-center justify-center min-w-[110px]">
                  💬 FB私訊訂購
                </a>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderPage() {
      const cardContainer = document.getElementById('productGrid');
      const listContainer = document.getElementById('productList');
      cardContainer.innerHTML = '';
      listContainer.innerHTML = '';

      const totalItems = filteredProducts.length;
      const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * PAGE_SIZE;
      const currentBatch = filteredProducts.slice(startIndex, startIndex + PAGE_SIZE);

      currentBatch.forEach(item => {
        if (currentViewMode === 'card') {
          cardContainer.insertAdjacentHTML('beforeend', createCard(item));
        } else {
          listContainer.insertAdjacentHTML('beforeend', createListItem(item));
        }
      });

      document.getElementById('pageInfo').innerText = `顯示第 ${currentPage} / ${totalPages} 頁 (本頁 ${currentBatch.length} 項, 共 ${totalItems} 項)`;
      renderPaginationControls(totalPages);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderPaginationControls(totalPages) {
      const ctrls = document.getElementById('paginationControls');
      ctrls.innerHTML = '';

      const prevBtn = document.createElement('button');
      prevBtn.innerText = "◀ 上一頁";
      prevBtn.disabled = (currentPage === 1);
      prevBtn.className = `px-2.5 py-1 rounded border border-slate-700 ${currentPage === 1 ? 'opacity-40 cursor-not-allowed' : 'bg-slate-800 hover:bg-amber-500 hover:text-slate-950 transition'}`;
      prevBtn.onclick = () => { if (currentPage > 1) { currentPage--; renderPage(); } };
      ctrls.appendChild(prevBtn);

      for (let i = 1; i <= totalPages; i++) {
        const pBtn = document.createElement('button');
        pBtn.innerText = i;
        if (i === currentPage) {
          pBtn.className = "px-2.5 py-1 rounded font-bold bg-amber-500 text-slate-950 shadow";
        } else {
          pBtn.className = "px-2.5 py-1 rounded bg-slate-800 border border-slate-700 hover:bg-slate-700 transition";
          pBtn.onclick = () => { currentPage = i; renderPage(); };
        }
        ctrls.appendChild(pBtn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.innerText = "下一頁 ▶";
      nextBtn.disabled = (currentPage === totalPages);
      nextBtn.className = `px-2.5 py-1 rounded border border-slate-700 ${currentPage === totalPages ? 'opacity-40 cursor-not-allowed' : 'bg-slate-800 hover:bg-amber-500 hover:text-slate-950 transition'}`;
      nextBtn.onclick = () => { if (currentPage < totalPages) { currentPage++; renderPage(); } };
      ctrls.appendChild(nextBtn);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const kw = e.target.value.toLowerCase().trim();
      filteredProducts = allProducts.filter(p => p.name.toLowerCase().includes(kw) || p.barcode.includes(kw) || p.brand.toLowerCase().includes(kw));
      currentPage = 1;
      renderPage();
    });

    function copyOrder(bc, name, price) {
      const text = `【預購登記】[${bc}] ${name} (NT$ ${price})`;
      navigator.clipboard.writeText(text).then(() => {
        alert("已成功複製商品下單格式！請至 Facebook 私訊爪哇魯多登記。");
      });
    }

    window.onload = init;
  </script>
</body>
</html>
