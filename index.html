<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>爪哇魯多模型店 - 預購商品目錄</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 強制橫向與直向手機皆為緊湊 2 欄呈列，桌機 4 欄 */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.5rem;
    }
    @media (min-width: 1024px) {
      .catalog-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.75rem;
      }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-3 py-2 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
      <div class="flex items-center space-x-2">
        <span class="text-xl">🤖</span>
        <h1 class="text-base sm:text-lg font-bold tracking-wider text-amber-400">爪哇魯多模型店 ｜ 預購目錄</h1>
      </div>
      
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <div class="bg-slate-800 p-0.5 rounded-lg border border-slate-700 flex text-xs font-semibold">
          <button id="btnCardMode" onclick="switchViewMode('card')" class="px-2.5 py-1 rounded-md bg-amber-500 text-slate-950 transition-all">🔲 卡片模式 (2*N)</button>
          <button id="btnListMode" onclick="switchViewMode('list')" class="px-2.5 py-1 rounded-md text-slate-300 hover:text-white transition-all">📋 清單模式</button>
        </div>
        <input id="searchInput" type="text" placeholder="搜尋條碼、品名關鍵字..." 
               class="flex-1 sm:w-56 px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:ring-1 focus:ring-amber-400 text-xs">
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-2 py-3">
    <!-- 緊湊型自適應網格：一屏完整容納 4 項 -->
    <div id="productGrid" class="catalog-grid"></div>
    <div id="productList" class="hidden flex flex-col gap-2 max-w-4xl mx-auto"></div>

    <div id="sentinel" class="py-6 text-center text-slate-500 text-xs">
      <span id="loadMoreText">往下滾動載入更多項目 (每頁 12 項)...</span>
    </div>
  </main>

  <div id="imageModal" class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-sm flex items-center justify-center p-3 cursor-zoom-out" onclick="closeModal()">
    <div class="relative max-w-3xl max-h-[90vh] flex flex-col items-center" onclick="event.stopPropagation()">
      <img id="modalImg" src="" class="max-w-full max-h-[80vh] rounded-lg shadow-2xl object-contain border border-slate-700">
      <p id="modalCaption" class="mt-2 text-xs sm:text-sm text-slate-200 font-medium text-center"></p>
      <button onclick="closeModal()" class="absolute -top-3 -right-3 w-8 h-8 bg-slate-800 hover:bg-slate-700 text-white rounded-full flex items-center justify-center font-bold text-sm border border-slate-600 shadow-md">✕</button>
    </div>
  </div>

  <script>
    let allProducts = [];
    let filteredProducts = [];
    let currentIndex = 0;
    let currentViewMode = 'card';
    const PAGE_SIZE = 12; // 嚴格採用每頁 12 項

    async function init() {
      try {
        const res = await fetch('data.json');
        allProducts = await res.json();
        filteredProducts = allProducts;
        loadNextPage();
        setupObserver();
      } catch (err) {
        document.getElementById('productGrid').innerHTML = '<p class="text-rose-400 p-4">無法載入 data.json</p>';
      }
    }

    function switchViewMode(mode) {
      currentViewMode = mode;
      const btnCard = document.getElementById('btnCardMode');
      const btnList = document.getElementById('btnListMode');
      const cardView = document.getElementById('productGrid');
      const listView = document.getElementById('productList');

      if (mode === 'card') {
        btnCard.className = "px-2.5 py-1 rounded-md bg-amber-500 text-slate-950 transition-all";
        btnList.className = "px-2.5 py-1 rounded-md text-slate-300 hover:text-white transition-all";
        cardView.classList.remove('hidden');
        listView.classList.add('hidden');
      } else {
        btnList.className = "px-2.5 py-1 rounded-md bg-amber-500 text-slate-950 transition-all";
        btnCard.className = "px-2.5 py-1 rounded-md text-slate-300 hover:text-white transition-all";
        listView.classList.remove('hidden');
        cardView.classList.add('hidden');
      }

      currentIndex = 0;
      cardView.innerHTML = '';
      listView.innerHTML = '';
      document.getElementById('loadMoreText').innerText = "往下滾動載入更多項目 (每頁 12 項)...";
      loadNextPage();
    }

    function openModal(src, title) {
      document.getElementById('modalImg').src = src;
      document.getElementById('modalCaption').innerText = title;
      document.getElementById('imageModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('imageModal').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    function getImageUrl(item) {
      const barcode = item.barcode || 'NO_BARCODE';
      return `./images/${barcode}.webp`;
    }

    function handleImageError(img, barcode) {
      if (!img.dataset.triedJpg) {
        img.dataset.triedJpg = "true";
        img.src = `./images/${barcode}.jpg`;
      } else if (!img.dataset.triedJpeg) {
        img.dataset.triedJpeg = "true";
        img.src = `./images/${barcode}.jpeg`;
      } else {
        img.onerror = null;
        img.src = `https://placehold.co/300x300/1e293b/94a3b8?text=${barcode}`;
      }
    }

    function createCard(item) {
      const finalImg = getImageUrl(item);
      return `
        <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden flex flex-col justify-between shadow hover:border-amber-400/40 transition-all text-xs">
          <div>
            <div class="relative w-full aspect-square bg-slate-800 overflow-hidden cursor-zoom-in" 
                 onclick="openModal('${finalImg}', '${item.name.replace(/'/g, "\\'")}')">
              <img src="${finalImg}" loading="lazy" decoding="async" alt="${item.name}" 
                   class="w-full h-full object-cover transition-transform duration-200 hover:scale-105"
                   onerror="handleImageError(this, '${item.barcode}')"/>
              <span class="absolute top-1.5 left-1.5 px-1.5 py-0.5 text-[10px] font-semibold bg-slate-950/80 text-amber-300 rounded backdrop-blur-sm">
                ${item.brand}
              </span>
              <span class="absolute bottom-1.5 right-1.5 px-1 py-0.5 text-[9px] bg-slate-900/70 text-slate-300 rounded">
                🔍 放大
              </span>
            </div>
            
            <div class="p-2 space-y-1">
              <div class="flex items-center justify-between text-[10px]">
                <span class="text-slate-400 bg-slate-800 px-1 py-0.2 rounded">#${item.id}</span>
                <span class="font-mono text-amber-400/80 truncate ml-1">${item.barcode}</span>
              </div>
              <h2 class="font-medium text-slate-100 line-clamp-2 leading-tight h-8" title="${item.name}">${item.name}</h2>
              <div class="text-[10px] text-slate-400 flex justify-between pt-0.5">
                <span>上市:${item.release_date}</span>
                <span class="text-rose-400 font-semibold">結單:${item.close_date}</span>
              </div>
            </div>
          </div>

          <div class="p-2 pt-0 border-t border-slate-800/80 mt-1 space-y-1.5">
            <div class="flex items-baseline justify-between pt-1">
              <span class="text-[10px] text-slate-400">特惠價</span>
              <span class="text-sm font-bold text-amber-400">NT$ ${item.preorder_price}</span>
            </div>
            <div class="grid grid-cols-2 gap-1">
              <button onclick="copyOrder('${item.barcode}', '${item.name.replace(/'/g, "\\'")}', ${item.preorder_price})" 
                      class="py-1 text-[11px] font-medium bg-amber-500 hover:bg-amber-400 text-slate-950 rounded transition-colors flex items-center justify-center">
                <span>📋 複製</span>
              </button>
              <a href="https://m.me/JavaRudo" target="_blank" rel="noopener noreferrer"
                 class="py-1 text-[11px] font-medium bg-blue-600 hover:bg-blue-500 text-white rounded transition-colors flex items-center justify-center">
                <span>💬 私訊</span>
              </a>
            </div>
          </div>
        </div>
      `;
    }

    function createListItem(item) {
      const finalImg = getImageUrl(item);
      return `
        <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden shadow flex hover:border-amber-400/40 transition-all text-xs">
          <div class="w-24 sm:w-32 aspect-square bg-slate-800 relative flex-shrink-0 cursor-zoom-in"
               onclick="openModal('${finalImg}', '${item.name.replace(/'/g, "\\'")}')">
            <img src="${finalImg}" loading="lazy" decoding="async" alt="${item.name}" 
                 class="w-full h-full object-cover" onerror="handleImageError(this, '${item.barcode}')"/>
          </div>
          <div class="flex-1 p-2.5 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center text-[10px] text-slate-400">
                <span>編號: #${item.id} | ${item.brand}</span>
                <span class="font-mono text-amber-400">${item.barcode}</span>
              </div>
              <h3 class="font-medium text-slate-100 text-xs mt-1 line-clamp-2 leading-tight">${item.name}</h3>
              <p class="text-[10px] text-slate-400 mt-1">預定上市: ${item.release_date} ｜ <span class="text-rose-400">結單: ${item.close_date}</span></p>
            </div>
            <div class="flex items-center justify-between pt-2 border-t border-slate-800/80">
              <span class="text-sm font-bold text-amber-400">NT$ ${item.preorder_price}</span>
              <div class="flex gap-1">
                <button onclick="copyOrder('${item.barcode}', '${item.name.replace(/'/g, "\\'")}', ${item.preorder_price})" 
                        class="px-2 py-1 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded text-[11px]">
                  📋 複製
                </button>
                <a href="https://m.me/JavaRudo" target="_blank" rel="noopener noreferrer"
                   class="px-2 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded text-[11px]">
                  💬 私訊
                </a>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function loadNextPage() {
      const cardContainer = document.getElementById('productGrid');
      const listContainer = document.getElementById('productList');
      const nextBatch = filteredProducts.slice(currentIndex, currentIndex + PAGE_SIZE);

      if (nextBatch.length === 0 && currentIndex > 0) {
        document.getElementById('loadMoreText').innerText = "— 所有品項已載入完畢 —";
        return;
      }

      nextBatch.forEach(item => {
        if (currentViewMode === 'card') {
          cardContainer.insertAdjacentHTML('beforeend', createCard(item));
        } else {
          listContainer.insertAdjacentHTML('beforeend', createListItem(item));
        }
      });

      currentIndex += nextBatch.length;
      if (currentIndex >= filteredProducts.length) {
        document.getElementById('loadMoreText').innerText = "— 所有品項已載入完畢 —";
      }
    }

    function setupObserver() {
      const sentinel = document.getElementById('sentinel');
      const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && currentIndex < filteredProducts.length) {
          loadNextPage();
        }
      }, { rootMargin: '250px' });
      observer.observe(sentinel);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const kw = e.target.value.toLowerCase().trim();
      filteredProducts = allProducts.filter(p => p.name.toLowerCase().includes(kw) || p.barcode.includes(kw) || p.brand.toLowerCase().includes(kw));
      currentIndex = 0;
      document.getElementById('productGrid').innerHTML = '';
      document.getElementById('productList').innerHTML = '';
      document.getElementById('loadMoreText').innerText = "往下滾動載入更多項目 (每頁 12 項)...";
      loadNextPage();
    });

    function copyOrder(bc, name, price) {
      const text = `【預購登記】[${bc}] ${name} (NT$ ${price})`;
      navigator.clipboard.writeText(text).then(() => {
        alert("已成功複製商品下單格式！請至 Facebook 私訊爪哇魯多登記。");
      });
    }

    window.onload = init;
  </script>
</body>
</html>
